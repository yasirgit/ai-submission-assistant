# Pytest, Ruff, and the frontend build block a merge.
# The evaluation job is separate. Hard-case failures exit 1 and block.
# The three known lexical misses are printed and exit 0, so they are a warning, not a gate.

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check app tests
      - run: uv run pytest

  evaluation:
    name: Golden set
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run python -m app.evaluation

  frontend:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
